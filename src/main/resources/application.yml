server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: notification-service
  config:
    import: classpath:observability/defaults.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3309/notification_db}
    username: ${DB_USERNAME:notification_service}
    password: ${DB_PASSWORD:notification_service}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway만 바꾼다
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest   # 서비스가 처음 뜰 때 이미 쌓인 이벤트도 받는다

nineouting:
  security:
    jwt:
      jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  inbox:
    # 쉼표로 구분, 공백 없이
    topics: user.email-verification-requested,user.password-reset-requested,workspace.member-join-requested,workspace.member-join-approved,meeting.created,meeting.updated,meeting.cancelled
  notification:
    user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
    retention: 90d
