server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: notification-service
  config:
    import: classpath:observability/defaults.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/notification_db}
    username: ${DB_USERNAME:notification_service}
    password: ${DB_PASSWORD:notification_service}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway만 바꾼다
  mail:
    # 개발·통합 테스트: Mailpit(받은 메일을 http://localhost:8025 에서 확인), 운영: AWS SES SMTP (인증 정보는 환경 변수)
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
  data:
    redis:
      # 여러 인스턴스로 띄울 때 SSE 알림을 모든 인스턴스에 전달한다 (Pub/Sub)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

nineouting:
  # 이벤트는 SNS로 보내고 서비스 큐(SQS)로 받는다. 자격 증명은 AWS SDK 기본 방식 (EKS는 IRSA, 로컬은 LocalStack)
  messaging:
    region: ${AWS_REGION:ap-northeast-2}
    endpoint: ${AWS_ENDPOINT_URL:}          # 비우면 AWS. 로컬은 LocalStack (http://localhost:4566)
    access-key: ${MESSAGING_ACCESS_KEY:}    # 비우면 AWS 기본 자격 증명. LocalStack은 test
    secret-key: ${MESSAGING_SECRET_KEY:}
  security:
    jwt:
      jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  inbox:
    # 이 서비스 큐. 받는 이벤트는 SNS 구독이 정한다: user.email-verification-requested, user.password-reset-requested, workspace.member-join-requested, workspace.member-join-approved, workspace.member-invited, meeting.created, meeting.updated, meeting.cancelled, minutes.review-requested, minutes.confirmed, minutes.edited
    queue: ${SQS_QUEUE_URL:http://localhost:4566/000000000000/nineouting-local-notification-service.fifo}
  clients:
    user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  notification:
    retention: 90d
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@nineouting.local}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    batch-size: 20
    max-attempts: 10
    sent-retention: 1d   # 보낸 메일 기록 (인증 코드가 들어 있어 짧게)
